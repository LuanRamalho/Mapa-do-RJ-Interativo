<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Mapa dos 92 Municípios do Rio de Janeiro
</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background:
        linear-gradient(
            180deg,
            #8fd3ff 0%,
            #dff5ff 55%,
            #bde5bc 100%
        );
}

#mapa {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    cursor: grab;
    user-select: none;
}

#mapa.arrastando {
    cursor: grabbing;
}

#grupoMapa {
    transform-origin: center center;
}

.municipio {
    stroke: #ffffff;
    stroke-width: 1.05;
    stroke-linejoin: round;
    stroke-linecap: round;
    fill-opacity: 0.93;
    vector-effect: non-scaling-stroke;
    cursor: pointer;
    transition:
        fill 80ms linear,
        stroke 80ms linear;
}

.municipio:hover,
.municipio:focus {
    fill: #fff200 !important;
    stroke: #111111;
    stroke-width: 2.8;
    outline: none;
}

#titulo {
    position: fixed;
    z-index: 20;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: min(700px, 88vw);
    padding: 14px 20px;
    text-align: center;
    background: rgba(255,255,255,0.97);
    border: 2px solid #1976d2;
    border-radius: 14px;
    box-shadow:
        0 4px 16px rgba(0,0,0,0.22);
    color: #163d63;
}

#titulo .principal {
    font-size: 23px;
    font-weight: bold;
}

#titulo .secundario {
    margin-top: 5px;
    font-size: 13px;
    color: #4d6980;
}

#info {
    position: fixed;
    z-index: 20;
    left: 17px;
    bottom: 17px;
    width: min(370px, 82vw);
    padding: 13px 15px;
    background: rgba(255,255,255,0.97);
    border: 1px solid #92b7d5;
    border-radius: 11px;
    box-shadow:
        0 3px 12px rgba(0,0,0,0.18);
    color: #28475e;
    font-size: 13px;
    line-height: 1.45;
}

#controles {
    position: fixed;
    z-index: 20;
    top: 115px;
    right: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.controle {
    width: 42px;
    height: 42px;
    border: 1px solid #9ab8cf;
    border-radius: 9px;
    background: rgba(255,255,255,0.96);
    color: #173d60;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    box-shadow:
        0 2px 8px rgba(0,0,0,0.18);
}

.controle:hover {
    background: #eaf5ff;
}

#tooltip {
    position: fixed;
    z-index: 100;
    display: none;
    min-width: 220px;
    max-width: 300px;
    pointer-events: none;
    padding: 12px 14px;
    border-radius: 11px;
    background: rgba(255,255,255,0.98);
    border: 2px solid #1976d2;
    box-shadow:
        0 4px 16px rgba(0,0,0,0.26);
    color: #183c5e;
}

#tooltip .nome {
    font-size: 17px;
    font-weight: bold;
}

#tooltip .populacao {
    margin-top: 5px;
    font-size: 14px;
}

#tooltip .codigo {
    margin-top: 3px;
    font-size: 11px;
    color: #70879b;
}

#carregando {
    position: fixed;
    z-index: 200;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eaf6ff;
    color: #163d63;
    font-size: 20px;
    font-weight: bold;
}

@media (max-width: 700px) {
    #titulo .principal {
        font-size: 18px;
    }

    #titulo .secundario {
        font-size: 11px;
    }

    #info {
        font-size: 11px;
    }
}
</style>
</head>

<div id="carregando">
    Preparando o mapa dos 92 municípios...
</div>

<div id="titulo">
    <div class="principal">
        Mapa dos 92 Municípios do Rio de Janeiro
    </div>

    <div class="secundario">
        Passe a seta sobre um município para visualizar
        seu nome e sua população.
    </div>
</div>

<div id="controles">
    <button
        class="controle"
        id="mais"
        title="Aumentar"
    >+</button>

    <button
        class="controle"
        id="menos"
        title="Diminuir"
    >−</button>

    <button
        class="controle"
        id="resetar"
        title="Voltar ao tamanho original"
    >⌂</button>
</div>

<div id="info">
    <b>Estado do Rio de Janeiro</b><br>
    92 municípios<br>
    População estimada pelo IBGE (2026):
    <b>17.225.410</b><br>
    <span style="font-size:11px;">

</div>

<div id="tooltip">

    <div

    <div

    ></div>
</div>

<script>
const mapa = document.getElementById("mapa");
const grupo = document.getElementById("grupoMapa");
const tooltip = document.getElementById("tooltip");
const tooltipNome = document.getElementById("tooltipNome");
const tooltipPopulacao =
    document.getElementById("tooltipPopulacao");
const tooltipCodigo =
    document.getElementById("tooltipCodigo");

const caminhos =
    document.querySelectorAll(".municipio");

const larguraOriginal = 1200;
const alturaOriginal = 780;

let escala = 1.0;
let deslocamentoX = 0;
let deslocamentoY = 0;

let arrastando = false;
let inicioX = 0;
let inicioY = 0;
let deslocamentoInicioX = 0;
let deslocamentoInicioY = 0;

function aplicarTransformacao() {
    grupo.setAttribute(
        "transform",
        `translate(${deslocamentoX} ${deslocamentoY})
         scale(${escala})`
    );
}

function formatarPopulacao(valor) {
    return Number(valor).toLocaleString("pt-BR");
}

function mostrarTooltip(evento, elemento) {
    const nome =
        elemento.dataset.nome;

    const populacao =
        Number(
            elemento.dataset.populacao
        );

    const codigo =
        elemento.dataset.codigo;

    tooltipNome.textContent =
        nome;

    tooltipPopulacao.textContent =
        "População estimada: "
        + formatarPopulacao(populacao)
        + " habitantes";

    tooltipCodigo.textContent =
        "Código IBGE: " + codigo;

    tooltip.style.display =
        "block";

    moverTooltip(evento);
}

function moverTooltip(evento) {
    const margem = 16;
    const largura =
        tooltip.offsetWidth;
    const altura =
        tooltip.offsetHeight;

    let x =
        evento.clientX + 18;

    let y =
        evento.clientY + 18;

    if (
        x + largura
        >
        window.innerWidth - margem
    ) {
        x =
            evento.clientX
            - largura
            - 18;
    }

    if (
        y + altura
        >
        window.innerHeight - margem
    ) {
        y =
            evento.clientY
            - altura
            - 18;
    }

    tooltip.style.left =
        Math.max(
            margem,
            x
        ) + "px";

    tooltip.style.top =
        Math.max(
            margem,
            y
        ) + "px";
}

function esconderTooltip() {
    tooltip.style.display =
        "none";
}

caminhos.forEach(
    elemento => {

        elemento.addEventListener(
            "mouseenter",
            evento => {
                mostrarTooltip(
                    evento,
                    elemento
                );
            }
        );

        elemento.addEventListener(
            "mousemove",
            evento => {
                moverTooltip(evento);
            }
        );

        elemento.addEventListener(
            "mouseleave",
            () => {
                esconderTooltip();
            }
        );

        elemento.addEventListener(
            "focus",
            evento => {
                mostrarTooltip(
                    evento,
                    elemento
                );
            }
        );

        elemento.addEventListener(
            "blur",
            () => {
                esconderTooltip();
            }
        );
    }
);

mapa.addEventListener(
    "mousedown",
    evento => {
        if (
            evento.button !== 0
        ) {
            return;
        }

        arrastando = true;

        mapa.classList.add(
            "arrastando"
        );

        inicioX =
            evento.clientX;

        inicioY =
            evento.clientY;

        deslocamentoInicioX =
            deslocamentoX;

        deslocamentoInicioY =
            deslocamentoY;

        esconderTooltip();
    }
);

window.addEventListener(
    "mousemove",
    evento => {
        if (!arrastando) {
            return;
        }

        const dx =
            evento.clientX - inicioX;

        const dy =
            evento.clientY - inicioY;

        deslocamentoX =
            deslocamentoInicioX
            + dx;

        deslocamentoY =
            deslocamentoInicioY
            + dy;

        aplicarTransformacao();
    }
);

window.addEventListener(
    "mouseup",
    () => {
        arrastando = false;

        mapa.classList.remove(
            "arrastando"
        );
    }
);

mapa.addEventListener(
    "wheel",
    evento => {
        evento.preventDefault();

        const fator =
            evento.deltaY < 0
                ? 1.12
                : 0.89;

        const escalaAnterior =
            escala;

        escala =
            Math.min(
                5.0,
                Math.max(
                    0.55,
                    escala * fator
                )
            );

        const rect =
            mapa.getBoundingClientRect();

        const centroX =
            evento.clientX
            - rect.left;

        const centroY =
            evento.clientY
            - rect.top;

        const fatorReal =
            escala / escalaAnterior;

        deslocamentoX =
            centroX
            - fatorReal
            * (centroX - deslocamentoX);

        deslocamentoY =
            centroY
            - fatorReal
            * (centroY - deslocamentoY);

        aplicarTransformacao();
        esconderTooltip();
    },
    {
        passive: false
    }
);

document.getElementById(
    "mais"
).addEventListener(
    "click",
    () => {
        escala =
            Math.min(
                5.0,
                escala * 1.18
            );

        aplicarTransformacao();
    }
);

document.getElementById(
    "menos"
).addEventListener(
    "click",
    () => {
        escala =
            Math.max(
                0.55,
                escala * 0.85
            );

        aplicarTransformacao();
    }
);

document.getElementById(
    "resetar"
).addEventListener(
    "click",
    () => {
        escala = 1.0;
        deslocamentoX = 0;
        deslocamentoY = 0;

        aplicarTransformacao();
        esconderTooltip();
    }
);

aplicarTransformacao();

document.getElementById(
    "carregando"
).style.display =
    "none";
</script>
